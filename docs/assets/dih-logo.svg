<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" fill="none">
  <defs>
    <filter id="dihShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#050608" flood-opacity="0.72"/>
    </filter>
    <linearGradient id="dihMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dfe4ec"/>
      <stop offset="100%" stop-color="#9aa2af"/>
    </linearGradient>
    <linearGradient id="dihRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#7c8492"/>
    </linearGradient>
  </defs>

  <!-- Centered 1400x300 transparent layout matching Deadshot.io #logo proportions -->
  <g filter="url(#dihShadow)">
    <!-- Centered precision emblem + wordmark lockup centered cleanly at x=700 -->
    <g transform="translate(700, 126)">
      <!-- Left letter: D + integrated architectural cutout -->
      <text x="-218" y="34" text-anchor="middle" fill="url(#dihMetal)"
        font-family="Segoe UI, Inter, Arial Black, sans-serif" font-size="136" font-weight="900" letter-spacing="10">DIH</text>

      <!-- Tactical reticle emblem seated cleanly beside centered divider -->
      <g transform="translate(38, -14)">
        <circle cx="0" cy="0" r="44" stroke="url(#dihRing)" stroke-width="5.5"/>
        <circle cx="0" cy="0" r="24" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
        <line x1="-60" y1="0" x2="-18" y2="0" stroke="#f2f4f7" stroke-width="4" stroke-linecap="round"/>
        <line x1="18" y1="0" x2="60" y2="0" stroke="#f2f4f7" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="-60" x2="0" y2="-18" stroke="#f2f4f7" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="18" x2="0" y2="60" stroke="#f2f4f7" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      </g>

      <!-- Right suffix matching .io weight cleanly -->
      <text x="210" y="28" text-anchor="middle" fill="#b4bcc8"
        font-family="Segoe UI, Inter, sans-serif" font-size="68" font-weight="800" letter-spacing="12">.CLIENT</text>
    </g>

    <!-- Symmetrical centered hairline tagline directly under x=700 -->
    <line x1="450" y1="204" x2="575" y2="204" stroke="#d4d8df" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="700" y="210" text-anchor="middle" fill="#c7cdd7"
      font-family="Consolas, JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="8">MINIMALIST NATIVE ENGINE</text>
    <line x1="825" y1="204" x2="950" y2="204" stroke="#d4d8df" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
